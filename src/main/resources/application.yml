spring:
  application:
    name: queryforge-sql-platform
  config:
    import: optional:file:./config/local.properties
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 120000

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

# P12 S2：Sa-Token 登录会话（身份唯一来源，Redis 持久化由 RedissonSaTokenDao 提供）。
sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:7200}
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  cookie:
    path: /
    http-only: true
    same-site: Lax
    secure: ${SA_TOKEN_COOKIE_SECURE:false}

app:
  management:
    url: ${MANAGEMENT_DB_URL:jdbc:mysql://127.0.0.1:3306/sql_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=false}
    username: ${MANAGEMENT_DB_USERNAME:platform_app}
    password: ${MANAGEMENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  security:
    encryption-key: ${APP_ENCRYPTION_KEY:}
  connection-policy:
    allowed-hosts: ${CONNECTION_ALLOWED_HOSTS:127.0.0.1,localhost}
    allowed-ports: ${CONNECTION_ALLOWED_PORTS:3306,3307,3308,3309,3310}
    connect-timeout-ms: ${CONNECTION_CONNECT_TIMEOUT_MS:3000}
    socket-timeout-ms: ${CONNECTION_SOCKET_TIMEOUT_MS:10000}
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    connect-timeout: ${LLM_CONNECT_TIMEOUT:10s}
    request-timeout: ${LLM_REQUEST_TIMEOUT:60s}
  embedding:
    base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://api.deepseek.com/v1}}
    api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
    model: ${EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    request-timeout: ${EMBEDDING_REQUEST_TIMEOUT:30s}
  sql:
    max-rows: ${SQL_MAX_ROWS:200}
    query-timeout-seconds: ${SQL_QUERY_TIMEOUT_SECONDS:5}
  agent:
    max-steps: ${AGENT_MAX_STEPS:3}
    max-repairs: ${AGENT_MAX_REPAIRS:2}
    max-plan-chars: ${AGENT_MAX_PLAN_CHARS:6000}
    max-llm-calls: ${AGENT_MAX_LLM_CALLS:12}
  schedule:
    poll-interval-ms: ${SCHEDULE_POLL_INTERVAL_MS:5000}
    lease-seconds: ${SCHEDULE_LEASE_SECONDS:60}
    max-claim-batch: ${SCHEDULE_MAX_CLAIM_BATCH:10}
    catch-up-window-minutes: ${SCHEDULE_CATCH_UP_WINDOW_MINUTES:15}
    min-interval-minutes: ${SCHEDULE_MIN_INTERVAL_MINUTES:1}
    execution-threads: ${SCHEDULE_EXECUTION_THREADS:4}
  # P12 S3：pgvector 独立 PostgreSQL 数据源（只存向量投影，不连管理库/用户业务库）。
  pg:
    url: ${PG_URL:jdbc:postgresql://127.0.0.1:5432/rageng}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:}
    maximum-pool-size: ${PG_MAX_POOL_SIZE:3}
  # P12 S5：连接 Schema 有界缓存（键 = connectionId，TTL 兜底 + 连接变更显式失效）。
  schema-cache:
    ttl-minutes: ${SCHEMA_CACHE_TTL_MINUTES:5}
    max-size: ${SCHEMA_CACHE_MAX_SIZE:500}
  # P12 S5：目标库 Hikari 池（按连接复用，空闲过期/容量有界，淘汰即关闭）。
  target-pool:
    max-pool-size: ${TARGET_POOL_MAX_SIZE:4}
    idle-timeout-minutes: ${TARGET_POOL_IDLE_TIMEOUT_MINUTES:10}
    max-lifetime-minutes: ${TARGET_POOL_MAX_LIFETIME_MINUTES:30}
    keepalive-seconds: ${TARGET_POOL_KEEPALIVE_SECONDS:60}
    connection-timeout-ms: ${TARGET_POOL_CONNECTION_TIMEOUT_MS:5000}
    max-cached-pools: ${TARGET_POOL_MAX_CACHED_POOLS:64}
  analysis:
    max-input-rows: ${ANALYSIS_MAX_INPUT_ROWS:200}
    max-input-bytes: ${ANALYSIS_MAX_INPUT_BYTES:262144}
    max-code-chars: ${ANALYSIS_MAX_CODE_CHARS:4000}
    timeout-seconds: ${ANALYSIS_TIMEOUT_SECONDS:20}
    memory-bytes: ${ANALYSIS_MEMORY_BYTES:268435456}
    cpus: ${ANALYSIS_CPUS:1.0}
    sandbox-image: ${ANALYSIS_SANDBOX_IMAGE:python:3.12-slim}
    sandbox-command: ${ANALYSIS_SANDBOX_COMMAND:python}
  mcp:
    servers:
      - name: local-echo
        transport: stdio
        command: node
        args:
          - ${MCP_ECHO_SCRIPT:tools/mcp-echo-server.mjs}

logging:
  level:
    com.queryforge: INFO
    org.springframework.jdbc.core: WARN
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    enable:
      all: false
